name: geobuzz
description: "GeoBuzz - Automate your world by location"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Location & Distance Calculation
  geolocator: ^12.0.0

  # Map - OpenStreetMap with flutter_map & latlong2 (pure Dart, reliable, free)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Local Storage
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # Notifications & Alarms
  flutter_local_notifications: ^17.2.2
  audioplayers: ^6.0.0
  vibration: ^3.2.0

  # HTTP & API Sync
  dio: ^5.4.3+1

  # Background Tracking Service
  flutter_background_service: ^5.0.10

  # UI & Design
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/