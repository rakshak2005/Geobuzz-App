name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile/flutter_app
        run: flutter pub get

      - name: Build Web
        working-directory: mobile/flutter_app
        run: flutter build web --release

      - name: Copy vercel.json to build output
        run: cp mobile/flutter_app/web/vercel.json mobile/flutter_app/build/web/vercel.json

      - name: Prepare Root Directory for Vercel
        run: |
          mkdir -p mobile/flutter_app/mobile/flutter_app
          cp -r mobile/flutter_app/build/web/* mobile/flutter_app/mobile/flutter_app/
          mkdir -p mobile/flutter_app/.vercel
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID }}"}' > mobile/flutter_app/.vercel/project.json

      - name: Deploy to Vercel
        working-directory: mobile/flutter_app
        run: npx --yes vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
