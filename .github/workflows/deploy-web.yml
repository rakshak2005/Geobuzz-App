name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile/flutter_app
        run: flutter pub get

      - name: Build Web
        working-directory: mobile/flutter_app
        run: flutter build web --release

      - name: Copy vercel.json to build output
        run: cp mobile/flutter_app/web/vercel.json mobile/flutter_app/build/web/vercel.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        working-directory: mobile/flutter_app/build/web
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }}
