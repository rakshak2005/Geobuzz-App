name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile/flutter_app
        run: flutter pub get

      - name: Build Web
        working-directory: mobile/flutter_app
        run: flutter build web --release

      - name: Copy vercel.json to build output
        run: cp mobile/flutter_app/web/vercel.json mobile/flutter_app/build/web/vercel.json

      - name: Deploy to Vercel
        uses: peaceiris/actions-gh-pages@v4
        if: false
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: mobile/flutter_app/build/web

      - name: Deploy via Vercel Action
        uses: BetaHuhn/deploy-to-vercel-action@v1
        with:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PRODUCTION: true
          WORKING_DIRECTORY: mobile/flutter_app/build/web
